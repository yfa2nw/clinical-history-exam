<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinical History & Exam</title>
  <meta name="description" content="A structured guide to clinical history-taking and physical examination, based on Talley & O'Connor's Clinical Examination.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="#/history/acute">
        <span class="brand__mark" aria-hidden="true">Hx</span>
        <span class="brand__name">Clinical History &amp; Exam</span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <a class="main-nav__link" data-module="history" href="#/history/acute">History<span class="nav-long"> Taking</span></a>
        <a class="main-nav__link" data-module="exam" href="#/exam/system"><span class="nav-long">Physical </span>Examination</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn icon-btn--text" id="abbr-open" type="button" aria-label="Search abbreviations" title="Abbreviations">A–Z</button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </div>
    </div>
  </header>

  <dialog class="abbr" id="abbr-dialog" aria-labelledby="abbr-title">
    <div class="abbr__head">
      <h2 class="abbr__title" id="abbr-title">Abbreviations</h2>
      <button class="icon-btn" id="abbr-close" type="button" aria-label="Close">×</button>
    </div>
    <input type="search" id="abbr-search" class="search" placeholder="Search, e.g. UTI or kidney" aria-label="Search abbreviations" autocomplete="off">
    <p class="abbr__count" id="abbr-count" aria-live="polite"></p>
    <dl class="abbr__list" id="abbr-list"></dl>
  </dialog>

  <main id="app" class="app" tabindex="-1">
    <!-- Rendered by js/app.js -->
    <noscript><p class="empty">This guide needs JavaScript enabled.</p></noscript>
  </main>

  <footer class="site-footer">
    <p>Primary reference: <cite>Talley &amp; O'Connor's Clinical Examination</cite>. For educational use only.</p>
  </footer>
